[project]
name = "curriculum"
version = "0.1.0"
description = "Parse university curricula and export Perfetto timeline traces"
readme = "README.md"
authors = [
    { name = "e1turin", email = "ivturnik2003@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "perfetto>=0.58.2",
]

[project.scripts]
curriculum = "curriculum.app:main"
curriculum-perfetto = "curriculum.perfetto:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    {include-group = "lint"},
]
lint = [
    "ruff>=0.16.9",
]
